# Twinkle 运行时配置。${ENV:-default} 仅用于机密 + 部署相关变量(路径/端点/端口);
# 可调参数(max_steps/压缩阈值/skill mode/permissions 策略)直接写值——改它就编辑本文件。
# 本文件可安全 commit:机密走 .env / 环境变量,不落盘于此。
agentserver:
  host: ${TWINKLE_AGENTSERVER_HOST:-127.0.0.1}
  port: ${TWINKLE_AGENTSERVER_PORT:-18000}
gateway:
  host: ${TWINKLE_GATEWAY_HOST:-127.0.0.1}
  port: ${TWINKLE_GATEWAY_PORT:-19000}
workspace:
  dir: ${TWINKLE_WORKSPACE_DIR:-}        # 空 → ~/.twinkle;sandbox 根,command_exec/file_tools 收敛其下
logging:
  dir: ${TWINKLE_LOG_DIR:-}              # 空 → <workspace>/logs
sessions:
  dir: ${TWINKLE_SESSIONS_DIR:-}         # 空 → <workspace>/.twinkle_data/sessions
todos:
  dir: ${TWINKLE_TODOS_DIR:-}            # 空 → <workspace>/.twinkle_data/todos
llm:
  base_url: ${TWINKLE_LLM_BASE_URL:-https://api.openai.com/v1}
  model: ${TWINKLE_LLM_MODEL:-gpt-4o-mini}
  api_key: ${TWINKLE_LLM_API_KEY:-}       # 机密:放 .env,别 commit
  timeout: 120.0                          # 单次读超时秒;模型 hang 住→APITimeoutError(瞬时,会被重试)
agent:
  max_steps: 1000                         # ReAct 最大步数,超限 yield e2a.error(防不收敛硬上限,非目标)
context_compression:
  token_threshold: 60000                  # 估算 token(char//3,不精确)超此即压缩历史
  keep_recent_pairs: 6                    # 保留最近 N 个 user/assistant 对
  summary_prompt: "你是对话上下文压缩器。把给定历史对话压成一段摘要，保留关键事实、用户偏好、已做决策、工具调用结果，丢弃寒暄与冗余。用中文。"
  summary_prompt_mode: structured         # structured(硬编码4节)/ free(用上面的 summary_prompt)
  micro_compact:                          # 块1: 同工具旧结果堆叠→marker(无 LLM)
    trigger_threshold: 5                  # 可清条数(总数-keep) > trigger 才清
    keep_recent_per_tool: 3               # 每工具留最近 N 条原文
    compactable_tool_names: [read_file, glob, command_exec, web_fetch, web_search]
    cleared_marker: "[Old tool result content cleared]"
  tool_result_budget:                     # 块1: 大 tool 结果→预览(无 LLM)
    tokens_threshold: 9000                # 所有 tool 结果总量超此才触发
    large_message_threshold: 3000         # 单条估算 token(char//3) 超此才 eligible
    trim_size: 3000                       # 预览保留字符数
    protect_latest: 1                     # 最新 N 条 tool result 永不 offload
skills:
  dir: ${TWINKLE_SKILLS_DIR:-}            # 空 → <workspace>/skills
  mode: all                               # all = 每步注入 skill 清单;auto_list = 模型按需调 list_skill 拉
  enabled: []                             # 列表;空 = 全开
  skillnet_api_url: http://api-skillnet.openkg.cn  # SkillNet 公开搜索服务(关键词搜索,503+ skill)
  skillhub_api_url: https://api.skillhub.cn  # SkillHub 公开列表/下载 API(关键词搜索 + zip 下载,免鉴权)
  github_token: ${TWINKLE_GITHUB_TOKEN:-}  # 可选;空=匿名(~60/小时),配 token 提 GitHub 下载额度
  remote_timeout: 60.0                    # 搜索/下载单次请求超时秒
  remote_max_retries: 3                   # 瞬时错误(5xx/网络)重试次数
memory:
  dir: ${TWINKLE_MEMORY_DIR:-}           # 空 → <workspace>/.twinkle_data/memory
  embed_model: text-embedding-3-small     # 复用 llm.api_key + llm.base_url,不另开 embed.* env
  query:
    max_results: 10
  hybrid:
    vector_weight: 0.7
    text_weight: 0.3
    candidate_multiplier: 2.0
  chunking:
    tokens: 256
    overlap: 32
  cleanup:
    max_chunks_per_file: 200              # 单文件 chunk 上限,超限 FIFO 丢最旧(5a 唯一自动淘汰;5c Dreaming 取代)
  index:
    debounce_seconds: 2.0                 # 写后去抖窗口秒:连续写塌成一次重索引(对齐 jiuwenswarm 防抖);写入路径零索引,search 兜底/后台 timer 异步索引
  auto_inject:
    enabled: true                 # 被动召回(默认开):before_invoke 一次把 USER.md + MEMORY.md 注入 system prefix(无 daily;daily 用 memory_search 召回=动态区)。超限各自 head+tail 截断(保首尾丢中间)。对齐 openclaw 分预算+trimBootstrap
    max_chars_user: 4000          # USER.md 注入上限(画像小而稳;对齐 openclaw USER_BOOTSTRAP_MAX_CHARS)
    max_chars_memory: 12000       # MEMORY.md 注入上限(累积会膨胀;大预算)。估算 char//3 ≈ 4000 token
  flush:
    enabled: false                # 兜底(opt-in):压缩前 LLM 查 middle 有无未持久化重要信息→write_memory 落盘。默认关=维持 5a
  dreaming:
    enabled: true                # 后台整理(默认开):周期跑 dream()——扫 daily_memory 非空行→claimHash 去重→跨≥min_distinct_files 日晋升进 MEMORY.md→单次 LLM 整合删冗余/矛盾行→compact 兜底容量(无晋升也 compact 丢手写)。无 LLM 仍 no-op
    interval_seconds: 3600        # 整理周期秒
    start_delay_seconds: 300      # 启动后首跑延迟秒
    top_k: 5                      # 聚类相似召回数(暂无消费者,备未来 search 用)
    min_distinct_files: 2          # 晋升门:同一事实须出现在 ≥N 个不同 daily 文件才搬进 MEMORY.md
    max_memory_chars: 10000       # MEMORY.md 容量预算,超限 compact 丢最老提升行
    max_delete_fraction: 0.25     # 整合步单次删除行数上限比例(安全阀,防 LLM 误删)
permissions:
  enabled: false                          # false = 系统关(全 ALLOW,无审计/无 ASK;command_exec 仍走 builtin_rules)
  enabled_channels: [web]
  global_default: allow                   # allow | require-approval | deny
  tools:
    command_exec: require-approval         # allow | require-approval | deny(require-approval 引擎归一为 ASK)
    web_fetch: allow
    web_search: allow
    todo_create: allow
    todo_update: allow
    todo_list: allow
    todo_get: allow
    memory_search: allow
    write_memory: allow
    read_memory: allow
    edit_memory: allow
  rules: []                               # 用户规则(同 jiuwenswarm rules[] 形状;v1 可空)
  approval_overrides: {}
  overrides_file: ${TWINKLE_PERMISSION_OVERRIDES_FILE:-}   # 空 → <workspace>/.twinkle_data/permission_overrides.json
  audit_file: ${TWINKLE_PERMISSION_AUDIT_FILE:-}          # 空 → <workspace>/logs/audit/permission_audit.jsonl
subagent:
  max_steps: 50                  # 子 ReAct 上限（紧于 agent.max_steps=1000）
  hard_timeout: 300             # 硬超时秒
  soft_timeout: 120             # 软超时（无活动）秒
  abort_timeout: 30              # 取消卡死子秒
  child_permissions: false       # v1 必须 false（true 需流式，未支持→启动拒）
  max_result_chars: 8000         # 子最终结果截断上限（防父上下文爆炸）
  list_sessions_filter: true     # session.list 隐藏 __sub_ 前缀
overflow_recovery:
  max_recovery_attempts: 3
  threshold_ratio: 0.85
  aggressive_keep_recent: 3
  context_window_limit_tokens: 0    # 0 = parse from 413 error; >0 = manual override
repeat_tool_detection:
  history_size: 30
  repeat_warn: 10
  pingpong_warn: 10
  loop_block: 20
  global_stop: 30
  remediation_max_per_minute: 5
evolution:
  enabled: false                # 总开关，默认关（进化改用户 skill，保守 opt-in）
  trigger: after_invoke         # after_invoke | after_tool_call | after_model_call | none
  auto_save: false              # 默认审批门（不静默写改）；true 才自动落盘
  max_text_records: 2           # 单轮文本经验上限
  max_script_records: 1         # 单轮脚本经验上限
  scoring:
    w_effectiveness: 0.5
    w_utilization: 0.3
    w_freshness: 0.2
    freshness_half_life_days: 90
    stale_version_penalty: 0.7
  distill:
    min_score: 0.4              # 分低于此 + 零调用 → 删
  signals:
    execution_failure: true
    script_artifact: true
    user_intent: false          # 默认关
team:
  enabled: false                # 默认关；true = 开启 Team 协作（delegate_to_member 工具 + leader prompt 注入）
